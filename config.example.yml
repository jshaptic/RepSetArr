# Repsetarr configuration.
#
# Everything below is optional except `sources` and `lists`. Values may contain
# ${ENV_VAR} or ${ENV_VAR:-fallback}, so secrets can stay in the environment.
#
# Two small languages, kept apart on purpose:
#
#   list_formula:  set algebra over sources and lists
#                    |  +  union        -  difference
#                    &  intersection    ^  in exactly one side
#                    *  wildcard - the union of every matching name
#                  Precedence follows Python's set operators - `-` and `+` bind
#                  tightest, then `&`, then `^`, then `|`. Bracket anything
#                  non-obvious. A name containing `-` must be quoted, because
#                  `-` is an operator: "top-250".
#                  `*` stands for any run of characters, dots included, so
#                  `animation.studios.*` is every source or list whose name
#                  starts that way. It is reserved: no name may contain one.
#
#   filter:        boolean algebra over names from the `filters:` block
#                    and  or  not, with `not` tightest and `and` before `or`.
#                  The names come from the top-level `filters:` block - it is
#                  an expression, not a single filter name.

server:
  host: 0.0.0.0
  port: 9797

cache:
  dir: /config/cache
  # Refresh interval for sources that do not set their own `ttl`.
  default_ttl: 6h
  # How often Repsetarr looks for sources that have aged out.
  check_interval: 1m
  persist: true

providers:
  mdblist:
    apikey: ${MDBLIST_API_KEY:-}

# Backfilling attributes that a source does not carry, so that filters work on
# items from Radarr, Sonarr, static blocks and bare JSON feeds too. Only the
# attributes some filter actually reads are ever fetched, in batches of 200, and
# the answers are kept for a month - so a config with no `filters:` makes no
# requests here at all. Needs `providers.mdblist.apikey`.
metadata:
  enabled: true
  ttl: 30d          # country, language and genre do not change
  miss_ttl: 7d      # how long to remember "the provider has never heard of it"
  budget: 2000      # most requests one enrichment pass may make
  reserve: 1000     # stop when the daily allowance drops below this

sources:
  # An MDBList list, addressed by `username/listname`, by `list_id`, or by a
  # pasted https://mdblist.com/lists/... URL.
  # trending_movies:
  #   type: mdblist
  #   list: someuser/trending-movies
  #   ttl: 12h
  #   media_type: movie      # any | movie | show
  #   limit: 500

  # What a Radarr or Sonarr instance already has.
  # my_radarr:
  #   type: radarr
  #   url: http://radarr:7878
  #   api_key: ${RADARR_API_KEY}
  #   monitored_only: false
  # my_sonarr:
  #   type: sonarr
  #   url: http://sonarr:8989
  #   api_key: ${SONARR_API_KEY}

  # Any JSON feed. `fields` is optional - common spellings are tried by default.
  # It also maps the descriptive fields, when the feed has them:
  # `country`, `original_language`, `spoken_language`, `genres`, `runtime`,
  # `content_rating`, `status`, `released`.
  # stevenlu:
  #   type: json
  #   url: https://popular-movies-data.stevenlu.com/movies.json
  #   media_type: movie
  #   fields:
  #     imdb: imdb_id

  # Ids written straight into the config - handy as a never-grab list.
  never:
    type: static
    media_type: movie
    items:
      - tmdb:550

# Named conditions, applied to lists through `filter:`. Within one block every
# line must hold; within one line, comma-separated values are alternatives.
#
#   country, original_language, spoken_language, content_rating, status, type
#                          bare = any of, `.not`
#   genre                  bare = any of, `.not`, `.all`
#   runtime, year          bare = equals, `.gt` `.gte` `.lt` `.lte`
#   release                `.before`, `.after`   (bare means `.after`)
#   title                  bare = contains, `.not`, `.begins`, `.ends`, `.regex`
#
# `unknown:` decides what a line answers when the item does not know the
# attribute; it defaults to `exclude`, matching the way `min_year` already drops
# items that have no year.
# filters:
  # Note `su`: MDBList reports one country per title, and Soviet-era films are
  # filed under it rather than under `ru`. Filtering on `original_language` is
  # often the steadier choice.
  # russian:
  #   country: ru, su
  #   unknown: exclude       # exclude | include
  # kids_safe:
  #   content_rating: G, PG
  #   runtime.lte: 100
  # animation:
  #   genre: animation

lists:
  # wanted_movies:
  #   list_formula: "(trending_movies | top250) - my_radarr - never"
  #   filter: "russian and (kids_safe or animation)"
  #   media_type: movie      # any | movie | show
  #   min_year: 1990
  #   sort: rank             # none | rank | title | year | released | random
  #   order: asc             # asc | desc
  #   limit: 200
  example:
    list_formula: "never"
    media_type: movie
